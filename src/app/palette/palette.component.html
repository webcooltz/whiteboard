<section>
  <h3>Tools</h3>
  <div class="tiles" role="radiogroup" aria-label="Tool">
    <button *ngFor="let tool of palette.tools; let i = index" type="button" class="tile" role="radio"
      [class.on]="tool === sel.tool" [attr.aria-checked]="tool === sel.tool" (click)="selectTool(tool)"
      [title]="tool.description + ' (' + (i + 1) + ')'">
      <canvas #preview *ngIf="tool.name !== 'Eraser'; else icon" width="112" height="48" aria-hidden="true"></canvas>
      <ng-template #icon><i [class]="tool.icon" aria-hidden="true"></i></ng-template>
      <span>{{ tool.name }}</span>
    </button>
  </div>
  <div class="seg" *ngIf="sel.tool.options.length > 1" role="radiogroup" aria-label="Line style">
    <button *ngFor="let o of sel.tool.options" type="button" role="radio" [class.on]="o === sel.tool.selectedOption"
      [attr.aria-checked]="o === sel.tool.selectedOption" (click)="selectToolOption(o)">{{ o.description }}</button>
  </div>
</section>

<section *ngIf="sel.tool.name !== 'Eraser'">
  <h3>Color</h3>
  <div class="swatches" role="radiogroup" aria-label="Color">
    <button *ngFor="let c of swatches" type="button" class="swatch" role="radio" [style.background]="c" [class.light]="c === '#ffffff'"
      [class.on]="c === sel.color" [attr.aria-checked]="c === sel.color" [attr.aria-label]="c" (click)="setColor(c)"></button>
    <button type="button" class="swatch custom" [class.on]="!isPreset" title="Custom color" aria-label="Custom color"
      [style.background]="isPreset ? null : sel.color"
      [colorPicker]="sel.color" (colorPickerChange)="setColor($event)" cpOutputFormat="hex" cpAlphaChannel="disabled"
      [cpUseRootViewContainer]="true" cpPosition="bottom"><i class="fas fa-eye-dropper" *ngIf="isPreset"></i></button>
  </div>
</section>

<section>
  <h3>{{ isSpray ? 'Spray width' : 'Size' }}</h3>
  <div class="size">
    <span class="dotbox"><span class="sizedot" [style.width.px]="dotPx" [style.height.px]="dotPx"
      [style.background]="sel.tool.name === 'Eraser' ? '#d1d5db' : sel.color"></span></span>
    <input type="range" min="1" [max]="isSpray ? 60 : 40" [ngModel]="isSpray ? sel.sprayOptions.radius : sel.brushSize"
      (ngModelChange)="setSize(+$event)" aria-label="Size">
    <output>{{ isSpray ? sel.sprayOptions.radius : sel.brushSize }}</output>
  </div>
  <div class="size" *ngIf="isSpray">
    <span class="dotbox"><i class="fas fa-braille"></i></span>
    <input type="range" min="5" max="100" [ngModel]="sel.sprayOptions.density" (ngModelChange)="updateSprayDensity(+$event)" aria-label="Spray density">
    <output>{{ sel.sprayOptions.density }}</output>
  </div>
</section>

<p class="keys"><kbd>1</kbd>–<kbd>8</kbd> tools &nbsp;<kbd>[</kbd> <kbd>]</kbd> size<br><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</p>
