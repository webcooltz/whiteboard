<form class="card" (ngSubmit)="submit()" autocomplete="on">
  <img class="logo" src="assets/logo.png" alt="" width="64" height="64">
  <h1>Whiteboard</h1>
  <p class="sub">{{ auth.needsPassword ? 'Sign in to draw together.' : 'What should we call you?' }}</p>
  <label class="field">
    Your name
    <input class="input" name="name" [(ngModel)]="name" autocomplete="username" maxlength="24" required autofocus
      placeholder="e.g. Sam">
  </label>
  <label class="field" *ngIf="auth.needsPassword">
    Board password
    <input class="input" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required>
  </label>
  <button class="btn primary big" type="submit" [disabled]="auth.busy || !name.trim() || (auth.needsPassword && !password)">
    {{ auth.busy ? 'Joining…' : 'Join the board' }}
  </button>
  <p class="error" *ngIf="auth.error" role="alert">{{ auth.error }}</p>
  <p class="note" *ngIf="auth.needsPassword">You only need the password once on this device.</p>
</form>
